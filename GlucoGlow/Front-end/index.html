<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>GlucoGlow</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="game-container">

        <h1>GLUCOGLOW</h1>

        <div id="top-bar">

            <div id="glucose-container">
                <span class="label">Glucose</span>
                <div id="glucose">75</div>
            </div>

            <div id="timer-container">
                <span class="label">Tijd</span>
                <div id="timer">120</div>
            </div>

        </div>

        <div id="status">VEILIG</div>

        <div id="situation">
            Thomas vertrekt naar school.
        </div>

        <div id="choices">

            <button id="redBtn">
                Keuze A
            </button>

            <button id="yellowBtn">
                Keuze B
            </button>

            <button id="greenBtn">
                Keuze C
            </button>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
