<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>GlucoGlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- STARTSCHERM -->

    <div id="start-screen">

        <h1>GLUCOGLOW</h1>

        <p class="intro-text">
            Help Thomas zijn glucose stabiel te houden.
        </p>

        <div class="roles">
            <p><strong>Speler 1:</strong> Zorgverlener</p>
            <p><strong>Speler 2:</strong> Beslisser</p>
        </div>

        <button id="startBtn">
            START
        </button>

    </div>

    <!-- SPEL -->

    <div id="game-container">

        <h1>GLUCOGLOW</h1>

        <div id="top-bar">

            <div id="glucose-container">
                <span class="label">Glucose</span>
                <div id="glucose">75</div>
            </div>

            <div id="timer-container">
                <span class="label">Tijd</span>
                <div id="timer">90</div>
            </div>

        </div>

        <div id="trend">→</div>

        <div id="situation"></div>

        <div id="choices">
            <div id="redBtn" class="choice-box"></div>
            <div id="yellowBtn" class="choice-box"></div>
            <div id="greenBtn" class="choice-box"></div>
        </div>

        <div id="choices">
            <div id="redBtn" class="choice-box"></div>
            <div id="yellowBtn" class="choice-box"></div>
            <div id="greenBtn" class="choice-box"></div>
        </div>

        <div id="quest-overlay"
            style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(11, 20, 26, 0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; text-align: center; backdrop-filter: blur(5px);">
            <div
                style="background-color: #1e293b; padding: 40px; border-radius: 20px; border: 2px solid #ef4444; box-shadow: 0 0 50px rgba(239, 68, 68, 0.4); width: 80%; max-width: 600px;">

                <h2
                    style="color: #ef4444; font-size: 2.5rem; margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">
                    ⚠ POMP VERGRENDELD ⚠</h2>
                <p style="color: #94a3b8; font-size: 1.2rem;">Voer medische override code in om insulinetoediening te
                    hervatten!</p>

                <div id="quest-timer-display"
                    style="font-size: 5rem; color: #ef4444; font-weight: bold; margin: 20px 0; font-family: monospace; text-shadow: 0 0 15px rgba(239,68,68,0.8);">
                    90</div>

                <input type="number" id="pinInput" placeholder="----"
                    style="font-size: 3rem; padding: 15px; width: 200px; text-align: center; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #38bdf8; margin-bottom: 20px; outline: none; letter-spacing: 5px;"><br>

                <button id="pinSubmitBtn"
                    style="background-color: #ef4444; color: white; font-size: 1.5rem; padding: 15px 40px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase;">OVERRIDE
                    STARTEN</button>

                <p id="pinFeedback"
                    style="color: #f59e0b; font-weight: bold; margin-top: 20px; height: 25px; font-size: 1.2rem;"></p>
            </div>
        </div>

        <div id="feedback-card">

            <h2 id="feedback-status"></h2>

            <p id="feedback-text"></p>

            <button id="nextBtn">
                VOLGENDE
            </button>

        </div>

    </div>

    <!-- EINDSCHERM -->

    <div id="end-screen">

        <h1 id="end-title">
            MISSIE GESLAAGD
        </h1>

        <p id="end-message">
            Thomas kwam veilig thuis.
        </p>

        <button id="restartBtn">
            OPNIEUW SPELEN
        </button>

    </div>

    <script>
        // 1. Generate a unique timestamp
        const timestamp = new Date().getTime();

        // 2. Make a new script element
        const script = document.createElement('script');

        // 3. Add the timestamp to the URL (e.g.: js/app.js?v=168493029)
        script.src = 'js/app.js?v=' + timestamp;

        // 4. Place it in the HTML
        document.body.appendChild(script);
    </script>

</body>

</html>
