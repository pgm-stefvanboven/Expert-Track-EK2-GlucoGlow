<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>GlucoGlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- STARTSCHERM -->

    <div id="start-screen">

        <h1>GLUCOGLOW</h1>

        <p class="intro-text">
            Help Thomas zijn glucose stabiel te houden.
        </p>

        <div class="roles">
            <p><strong>Speler 1:</strong> Zorgverlener</p>
            <p><strong>Speler 2:</strong> Beslisser</p>
        </div>

        <div id="highscore-box">
            Beste record: <span id="highscore"></span> punten
        </div>

        <button id="startBtn">
            START
        </button>

        <div id="team-overlay">

            <div class="team-card">

                <h2>TEAMNAAM</h2>

                <div id="teamDisplay"></div>

                <div id="keyboard"></div>

                <div class="keyboard-actions">
                    <button id="backspaceBtn">⌫</button>
                    <button id="spaceBtn">SPATIE</button>
                    <button id="teamOkBtn">OK</button>
                </div>

            </div>

        </div>

    </div>

    <!-- SPEL -->

    <div id="game-container">

        <h1>GLUCOGLOW</h1>

        <div id="top-bar">

            <div id="glucose-container">
                <span class="label">Glucose</span>
                <div id="glucose">75</div>
            </div>

            <div id="timer-container">
                <span class="label">Tijd</span>
                <div id="timer">90</div>
            </div>

        </div>

        <div id="trend">→</div>

        <div id="situation"></div>

        <div id="choices">
            <div id="redBtn" class="choice-box"></div>
            <div id="yellowBtn" class="choice-box"></div>
            <div id="greenBtn" class="choice-box"></div>
        </div>

        <div id="quest-overlay"
            style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(11, 20, 26, 0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; text-align: center; backdrop-filter: blur(5px);">
            <div
                style="background-color: #1e293b; padding: 30px; border-radius: 20px; border: 2px solid #ef4444; box-shadow: 0 0 50px rgba(239, 68, 68, 0.4); width: 90%; max-width: 500px;">

                <h2 style="color: #ef4444; font-size: 1.5rem; margin-top: 0; text-transform: uppercase;">POMP
                    VERGRENDELD</h2>

                <div id="quest-timer-display"
                    style="font-size: 2.8rem; color: #ef4444; font-weight: bold; margin: 10px 0; font-family: monospace;">
                    90</div>

                <div id="pinDisplay"
                    style="font-size: 2rem; padding: 10px; width: 200px; margin: 0 auto 20px auto; text-align: center; border-radius: 10px; border: 2px solid #334155; background: #0f172a; color: #38bdf8; letter-spacing: 10px; font-family: monospace; min-height: 55px;">
                </div>

                <p id="pinFeedback"
                    style="color: #f59e0b; font-weight: bold; height: 20px; margin: 0 0 15px 0; font-size: 1.1rem;"></p>

                <div id="numpad"
                    style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 240px; margin: 0 auto;">
                    <button class="num-btn" onclick="addPin('1')">1</button>
                    <button class="num-btn" onclick="addPin('2')">2</button>
                    <button class="num-btn" onclick="addPin('3')">3</button>
                    <button class="num-btn" onclick="addPin('4')">4</button>
                    <button class="num-btn" onclick="addPin('5')">5</button>
                    <button class="num-btn" onclick="addPin('6')">6</button>
                    <button class="num-btn" onclick="addPin('7')">7</button>
                    <button class="num-btn" onclick="addPin('8')">8</button>
                    <button class="num-btn" onclick="addPin('9')">9</button>
                    <button class="num-btn clear-btn" onclick="clearPin()" style="background-color: #ef4444;">C</button>
                    <button class="num-btn" onclick="addPin('0')">0</button>
                    <button class="num-btn submit-btn" onclick="submitPin()"
                        style="background-color: #10b981;">OK</button>
                </div>
            </div>
        </div>

        <style>
            /* Styling speciaal voor de numpad knoppen */
            .num-btn {
                background-color: #334155;
                color: white;
                font-size: 1.3rem;
                padding: 10px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                font-weight: bold;
            }

            .num-btn:active {
                background-color: #475569;
                transform: scale(0.95);
            }
        </style>

        <div id="feedback-card">

            <h2 id="feedback-status"></h2>

            <p id="feedback-text"></p>

            <button id="nextBtn">
                VOLGENDE
            </button>

        </div>

    </div>

    <!-- EINDSCHERM -->

    <div id="end-screen">

        <h1 id="end-title">
            MISSIE GESLAAGD
        </h1>

        <p id="end-message">
            Thomas kwam veilig thuis.
        </p>

        <p id="end-score">
            Score: 0 punten
        </p>

        <p id="restartCountdown">
            Terug naar het startscherm over <span id="countdown">5</span> seconden...
        </p>

    </div>

    <script>
        // 1. Generate a unique timestamp
        const timestamp = new Date().getTime();

        // 2. Make a new script element
        const script = document.createElement('script');

        // 3. Add the timestamp to the URL (e.g.: js/app.js?v=168493029)
        script.src = 'js/app.js?v=' + timestamp;

        // 4. Place it in the HTML
        document.body.appendChild(script);
    </script>

</body>

</html>
